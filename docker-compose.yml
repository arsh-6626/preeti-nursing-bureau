# Optional: use with `docker compose up -d` if the Compose plugin is installed.
# Otherwise use `npm run db:up` (plain `docker run`).
services:
  db:
    image: postgres:16-alpine
    container_name: pnb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pnb
      POSTGRES_PASSWORD: pnb_dev_password
      POSTGRES_DB: pnb
    ports:
      - "5544:5432"
    volumes:
      - pnb-pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  pnb-pgdata:
